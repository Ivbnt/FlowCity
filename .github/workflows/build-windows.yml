name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installer + portable
        run: npx --yes electron-builder@25.1.8 --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Flowcity-windows
          path: |
            release/*.exe
          if-no-files-found: error
